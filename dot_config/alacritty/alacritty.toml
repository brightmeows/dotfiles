[general]
# macchiato 打底；omarchy state 主题存在时按加载顺序覆盖（缺失则跳过）
import = ["themes/catppuccin-macchiato.toml", "~/.local/state/omarchy/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
shell = "nu"
osc52 = "CopyPaste"

[cursor]
style.blinking = "Always"
style.shape = "Underline"

[font]
size = 12.5
normal.family = "ComicShannsMono Nerd Font"

[scrolling]
history = 100000

[bell]
# 终端响铃（如 pi 问卷等待输入）时把响铃窗口所在工作区交给
# brightmeows.workspaces 插件标记状态栏圆点；焦点抢占由 Hyprland 的
# focus_on_activate = false 窗口规则拦截。
command = "/home/brightmeows/.config/omarchy/plugins/brightmeows.workspaces/bell-flag.sh"

[window]
opacity = 0.9
padding.x = 5
padding.y = 3

[keyboard]
bindings = [
  { key = "F1", action = "ToggleViMode" },
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  # Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  # Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
]
