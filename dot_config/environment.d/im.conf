# 输入法环境变量（systemd user session 注入，所有图形应用继承）
#
# XMODIFIERS  : XIM 通道，供纯 X11/XWayland 应用（wine/flatpak/老旧程序）接入 fcitx5
# QT_IM_MODULE: Qt 通道。微信 4.x 静态 Qt 内嵌 fcitx-qt5 插件，需此变量激活后经 D-Bus 接入 fcitx5；
#               其未加载 libwayland，无法走 text-input 协议，只能走此通道
# 不设 GTK_IM_MODULE：GTK 与 Chromium/Electron（QQ/B站等）在 Wayland 下走 text-input-v3，
#                      遵循 fcitx5 官方 KDE Plasma 推荐；设此变量反会令其退回 GTK im 模块
XMODIFIERS=@im=fcitx
QT_IM_MODULE=fcitx
