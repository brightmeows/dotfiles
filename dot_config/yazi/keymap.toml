# compress.yazi：打包选中文件（按 ca 出菜单，再按子键选模式）
[[mgr.prepend_keymap]]
on = ["c", "a", "a"]
run = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["c", "a", "p"]
run = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on = ["c", "a", "h"]
run = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on = ["c", "a", "l"]
run = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on = ["c", "a", "u"]
run = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

# enter-archive：回车 = 进压缩包浏览（解压到 ~/.cache/yazi/archive/ 缓存），
# o = 整包解压到包旁（全格式，zst 走 bsdtar 兤底）；详见插件源码头注释。
# 目录与普通文件保持默认 open 行为（默认 o 与 <Enter> 均为 open，语义不变）。
[[mgr.prepend_keymap]]
on = ["<Enter>"]
run = "plugin enter-archive"
desc = "Enter archive (browse in cache)"

[[mgr.prepend_keymap]]
on = ["o"]
run = "plugin enter-archive -- --extract"
desc = "Extract archive next to it"
