# 共享片段：规则集锚定义与 rule-providers（sukkaw ruleset）。
# 消费点：config.yaml.tmpl 与 party-override.yaml.tmpl（include 拼接）。
# rules.part.yaml 引用本片段定义的 RuleSet_* 锚，两片段必须同文档出现。
# proxy 字段指向“🚀 节点选择”：该组在两份配置中均由组结构段提供。
RuleSet_classical:
  &RuleSet_classical {
    type: http,
    behavior: classical,
    interval: 43200,
    format: text,
    proxy: 🚀 节点选择,
  }
RuleSet_domain:
  &RuleSet_domain {
    type: http,
    behavior: domain,
    interval: 43200,
    format: text,
    proxy: 🚀 节点选择,
  }
RuleSet_ipcidr:
  &RuleSet_ipcidr {
    type: http,
    behavior: ipcidr,
    interval: 43200,
    format: text,
    proxy: 🚀 节点选择,
  }

# 订阅规则
rule-providers:
  reject_non_ip_no_drop:
    <<: *RuleSet_classical
    url: "https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt"
    path: "./rule_set/sukkaw_ruleset/reject_non_ip_no_drop.txt"

  reject_non_ip_drop:
