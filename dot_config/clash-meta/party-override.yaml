# Clash Party / Verge Rev 覆写壳（由 gen-party-override.sh 生成，勿手改）
# 分发：https://raw.githubusercontent.com/brightmeows/dotfiles/main/dot_config/clash-meta/party-override.yaml
# 用法：Clash Party「覆写」页导入上述 URL 并挂到目标订阅；Verge Rev 作为全局扩展配置导入
#       （两家对列表字段均为整体替换：机场订阅自带的 rules / proxy-groups 被本壳完整换掉）
# 共享事实源：.chezmoidata/clash-meta.yaml + .fragments/，与主配置 config.yaml.tmpl 同源
# 共享片段：地区筛选锚定义。
# 消费点：config.yaml.tmpl 与 party-override.yaml.tmpl（include 拼接）。
# 锚名被 .chezmoidata/clash-meta.yaml 的 regions[].filter 引用；新增正则时同步数据文件。
# 抓取 yaml 参考必须 curl（web_fetch 会压平多空格缩进），改正则后跑 mihomo -t 验证。
# 按地区筛选
FilterHK: &FilterHK '^(?=.*((?i)🇭🇰|香港|\b(HK|Hong)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterTW: &FilterTW '^(?=.*((?i)🇹🇼|台湾|\b(TW|Tai|Taiwan)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterJP: &FilterJP '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|\b(JP|Japan)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterKR: &FilterKR '^(?=.*((?i)🇰🇷|韩国|韓|首尔|\b(KR|Korea)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterSG: &FilterSG '^(?=.*((?i)🇸🇬|新加坡|狮|\b(SG|Singapore)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterUS: &FilterUS '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|\b(US|United States)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterUK: &FilterUK '^(?=.*((?i)🇬🇧|英国|伦敦|\b(UK|United Kingdom)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterFR: &FilterFR '^(?=.*((?i)🇫🇷|法国|\b(FR|France)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
FilterDE: &FilterDE '^(?=.*((?i)🇩🇪|德国|\b(DE|Germany)(\d+)?\b))(?!.*((?i)回国|校园|网站|地址|剩余|过期|时间|有效|网址|禁止|邮箱|发布|客服|订阅|节点)).*$'
# 负向 lookahead 只列已知地区词：信息类假节点已在 provider 层 exclude-filter 统一剔除，
# 不再依赖各 filter 的排除段兜底（地区 filter 里的“回国/校园”排除仍用于特殊线路归类）
FilterOthers: &FilterOthers "^(?!.*(🇭🇰|HK|Hong|香港|🇹🇼|TW|Taiwan|Wan|台湾|🇯🇵|JP|Japan|日本|🇸🇬|SG|Singapore|狮城|新加坡|🇺🇸|US|United States|America|美国|🇩🇪|DE|Germany|德国|🇬🇧|UK|United Kingdom|英国|🇰🇷|KR|Korea|韩国|韓|🇫🇷|FR|France|法国)).*$"


# 域名分流组成员锚（壳版：无订阅级组，默认随“🚀 节点选择”，可按网站指定地区出口）
DomainGroupMembers: &DomainGroupMembers
  - 🚀 节点选择
  - 🇭🇰 香港 - 自动选择
  - 🇭🇰 香港 - 手动选择
  - 🇹🇼 台湾 - 自动选择
  - 🇹🇼 台湾 - 手动选择
  - 🇰🇷 韩国 - 自动选择
  - 🇰🇷 韩国 - 手动选择
  - 🇯🇵 日本 - 自动选择
  - 🇯🇵 日本 - 手动选择
  - 🇸🇬 新加坡 - 自动选择
  - 🇸🇬 新加坡 - 手动选择
  - 🇺🇸 美国 - 自动选择
  - 🇺🇸 美国 - 手动选择
  - 🌐 其它 - 自动选择
  - 🌐 其它 - 手动选择
  - DIRECT

# 策略组：顶层选择 / 地区自动手动 / 域名分流 / BOF
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🇭🇰 香港 - 自动选择
      - 🇭🇰 香港 - 手动选择
      - 🇹🇼 台湾 - 自动选择
      - 🇹🇼 台湾 - 手动选择
      - 🇰🇷 韩国 - 自动选择
      - 🇰🇷 韩国 - 手动选择
      - 🇯🇵 日本 - 自动选择
      - 🇯🇵 日本 - 手动选择
      - 🇸🇬 新加坡 - 自动选择
      - 🇸🇬 新加坡 - 手动选择
      - 🇺🇸 美国 - 自动选择
      - 🇺🇸 美国 - 手动选择
      - 🌐 其它 - 自动选择
      - 🌐 其它 - 手动选择
      - DIRECT

  # 地区自动/手动选择（include-all 跨订阅汇入；自动组 gstatic URL 与主配置同构）
  - { name: 🇭🇰 香港 - 自动选择, type: url-test, include-all: true, filter: *FilterHK, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 100 }
  - { name: 🇭🇰 香港 - 手动选择, type: select, include-all: true, filter: *FilterHK }
  - { name: 🇹🇼 台湾 - 自动选择, type: url-test, include-all: true, filter: *FilterTW, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 100 }
  - { name: 🇹🇼 台湾 - 手动选择, type: select, include-all: true, filter: *FilterTW }
  - { name: 🇰🇷 韩国 - 自动选择, type: url-test, include-all: true, filter: *FilterKR, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 100 }
  - { name: 🇰🇷 韩国 - 手动选择, type: select, include-all: true, filter: *FilterKR }
  - { name: 🇯🇵 日本 - 自动选择, type: url-test, include-all: true, filter: *FilterJP, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 100 }
  - { name: 🇯🇵 日本 - 手动选择, type: select, include-all: true, filter: *FilterJP }
  - { name: 🇸🇬 新加坡 - 自动选择, type: url-test, include-all: true, filter: *FilterSG, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 100 }
  - { name: 🇸🇬 新加坡 - 手动选择, type: select, include-all: true, filter: *FilterSG }
  - { name: 🇺🇸 美国 - 自动选择, type: url-test, include-all: true, filter: *FilterUS, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 100 }
  - { name: 🇺🇸 美国 - 手动选择, type: select, include-all: true, filter: *FilterUS }
  - { name: 🌐 其它 - 自动选择, type: url-test, include-all: true, filter: *FilterOthers, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 100 }
  - { name: 🌐 其它 - 手动选择, type: select, include-all: true, filter: *FilterOthers }

  # 域名分流组（定义在地区组之后：面板组顺序 = 配置定义顺序，保持“地区、领域”两段）
  - { name: 🤖 AI, type: select, proxies: *DomainGroupMembers }
  - { name: ✈️ Telegram, type: select, proxies: *DomainGroupMembers }
  - { name: 🎬 流媒体与下载, type: select, proxies: *DomainGroupMembers }
  # BOF 组首项 DIRECT 即默认出口：BOF 投稿要求住宅 IP 来源
  - name: 🎵 BOF
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港 - 自动选择
      - 🇭🇰 香港 - 手动选择
      - 🇹🇼 台湾 - 自动选择
      - 🇹🇼 台湾 - 手动选择
      - 🇰🇷 韩国 - 自动选择
      - 🇰🇷 韩国 - 手动选择
      - 🇯🇵 日本 - 自动选择
      - 🇯🇵 日本 - 手动选择
      - 🇸🇬 新加坡 - 自动选择
      - 🇸🇬 新加坡 - 手动选择
      - 🇺🇸 美国 - 自动选择
      - 🇺🇸 美国 - 手动选择
      - 🌐 其它 - 自动选择
      - 🌐 其它 - 手动选择

# 共享片段：规则集锚定义与 rule-providers（sukkaw ruleset）。
# 消费点：config.yaml.tmpl 与 party-override.yaml.tmpl（include 拼接）。
# rules.part.yaml 引用本片段定义的 RuleSet_* 锚，两片段必须同文档出现。
# proxy 字段指向“🚀 节点选择”：该组在两份配置中均由组结构段提供。
RuleSet_classical:
  &RuleSet_classical {
    type: http,
    behavior: classical,
    interval: 43200,
    format: text,
    proxy: 🚀 节点选择,
  }
RuleSet_domain:
  &RuleSet_domain {
    type: http,
    behavior: domain,
    interval: 43200,
    format: text,
    proxy: 🚀 节点选择,
  }
RuleSet_ipcidr:
  &RuleSet_ipcidr {
    type: http,
    behavior: ipcidr,
    interval: 43200,
    format: text,
    proxy: 🚀 节点选择,
  }

# 订阅规则
rule-providers:
  reject_non_ip_no_drop:
    <<: *RuleSet_classical
    url: "https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt"
    path: "./rule_set/sukkaw_ruleset/reject_non_ip_no_drop.txt"

  reject_non_ip_drop:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/reject-drop.txt
    path: ./rule_set/sukkaw_ruleset/reject_non_ip_drop.txt

  reject_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/reject.txt
    path: ./rule_set/sukkaw_ruleset/reject_non_ip.txt

  reject_domainset:
    <<: *RuleSet_domain
    url: https://ruleset.skk.moe/Clash/domainset/reject.txt
    path: ./rule_set/sukkaw_ruleset/reject_domainset.txt

  reject_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/reject.txt
    path: ./rule_set/sukkaw_ruleset/reject_ip.txt

  cdn_domainset:
    <<: *RuleSet_domain
    url: https://ruleset.skk.moe/Clash/domainset/cdn.txt
    path: ./rule_set/sukkaw_ruleset/cdn_domainset.txt

  cdn_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/cdn.txt
    path: ./rule_set/sukkaw_ruleset/cdn_non_ip.txt

  # 所有流媒体（包括上述所有流媒体）
  stream_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/stream.txt
    path: ./rule_set/sukkaw_ruleset/stream_non_ip.txt
  stream_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/stream.txt
    path: ./rule_set/sukkaw_ruleset/stream_ip.txt

  ai_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/ai.txt
    path: ./rule_set/sukkaw_ruleset/ai_non_ip.txt

  telegram_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/telegram.txt
    path: ./rule_set/sukkaw_ruleset/telegram_non_ip.txt

  telegram_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/telegram.txt
    path: ./rule_set/sukkaw_ruleset/telegram_ip.txt

  apple_cdn:
    <<: *RuleSet_domain
    url: https://ruleset.skk.moe/Clash/domainset/apple_cdn.txt
    path: ./rule_set/sukkaw_ruleset/apple_cdn.txt

  apple_services:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/apple_services.txt
    path: ./rule_set/sukkaw_ruleset/apple_services.txt

  apple_cn_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/apple_cn.txt
    path: ./rule_set/sukkaw_ruleset/apple_cn_non_ip.txt

  microsoft_cdn_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/microsoft_cdn.txt
    path: ./rule_set/sukkaw_ruleset/microsoft_cdn_non_ip.txt

  microsoft_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/microsoft.txt
    path: ./rule_set/sukkaw_ruleset/microsoft_non_ip.txt

  # 软件更新、操作系统等大文件下载
  download_domainset:
    <<: *RuleSet_domain
    url: https://ruleset.skk.moe/Clash/domainset/download.txt
    path: ./rule_set/sukkaw_ruleset/download_domainset.txt
  download_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/download.txt
    path: ./rule_set/sukkaw_ruleset/download_non_ip.txt

  # 内网域名和局域网 IP
  lan_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/lan.txt
    path: ./rule_set/sukkaw_ruleset/lan_non_ip.txt
  lan_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/lan.txt
    path: ./rule_set/sukkaw_ruleset/lan_ip.txt

  domestic_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/domestic.txt
    path: ./rule_set/sukkaw_ruleset/domestic_non_ip.txt
  direct_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/direct.txt
    path: ./rule_set/sukkaw_ruleset/direct_non_ip.txt
  global_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/global.txt
    path: ./rule_set/sukkaw_ruleset/global_non_ip.txt
  domestic_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/domestic.txt
    path: ./rule_set/sukkaw_ruleset/domestic_ip.txt

  china_ip:
    <<: *RuleSet_ipcidr
    url: https://ruleset.skk.moe/Clash/ip/china_ip.txt
    path: ./rule_set/sukkaw_ruleset/china_ip.txt


rules:
# 共享片段：静态分流规则行（位于 rules: 列表内，两空格缩进）。
# 消费点：config.yaml.tmpl（订阅域名直连循环之后）与 party-override.yaml.tmpl（rules: 键头之后）。
# 出口组名依赖组结构段：主配置含订阅级组，壳版仅地区组；🚀 节点选择、🎵 BOF 两边同名。
  # SSH 直连：机场普遍封出站 22 端口（防 SSH 跳板），SSH 走代理必然超时
  # 一条端口规则覆盖所有 SSH 目标，无需逐域名添加
  - DST-PORT,22,DIRECT

  # RustDesk 注册与打洞直连：rendezvous 的 register_pk/UDP 打洞经节点转发时
  # 响应回不来（节点 UDP 黑洞），key 永不确认，对端显示“设备离线或不存在”
  # 须置于 global_non_ip 等 RULE-SET 之前，防止 rustdesk.com 被全局列表先匹配到节点
  - DOMAIN-SUFFIX,rustdesk.com,DIRECT

  # BOF 会场与 BMS 谱面站：BOF 组默认直连，投稿来源须为住宅 IP；
  # manbow 是日本源站，需要时可从组内切到节点
  - DOMAIN-SUFFIX,bmsoffighters.net,🎵 BOF
  - DOMAIN-SUFFIX,manbow.nothing.sh,🎵 BOF

  ### 非 IP 类规则
  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_non_ip_no_drop,REJECT
  - RULE-SET,cdn_domainset,🚀 节点选择
  - RULE-SET,cdn_non_ip,🚀 节点选择
  - RULE-SET,stream_non_ip,🎬 流媒体与下载
  - RULE-SET,telegram_non_ip,✈️ Telegram
  - RULE-SET,apple_cdn,DIRECT
  - RULE-SET,download_domainset,🎬 流媒体与下载
  - RULE-SET,download_non_ip,🎬 流媒体与下载
  - RULE-SET,microsoft_cdn_non_ip,DIRECT
  - RULE-SET,apple_cn_non_ip,DIRECT
  - RULE-SET,apple_services,🚀 节点选择
  - RULE-SET,microsoft_non_ip,🚀 节点选择
  - RULE-SET,ai_non_ip,🤖 AI
  - RULE-SET,global_non_ip,🚀 节点选择
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,lan_non_ip,DIRECT

  ### IP 类规则
  - RULE-SET,reject_ip,REJECT
  - RULE-SET,telegram_ip,✈️ Telegram
  - RULE-SET,stream_ip,🎬 流媒体与下载
  - RULE-SET,lan_ip,DIRECT
  - RULE-SET,domestic_ip,DIRECT
  - RULE-SET,china_ip,DIRECT

  - MATCH,🚀 节点选择

