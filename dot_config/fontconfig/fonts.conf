<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 终端字体的 emoji/符号 fallback 顺序修复。
       背景：BMP 符号区 emoji（U+2600/U+2700 区，如 ❤ ✅ ☀）按默认排序会落到
       Adwaita Mono 等文本字体上，显示成黑白字形；颜文字符号（ᴗ ˃ ˇ 等）
       散落多种字体导致风格混杂。这里给终端字体显式追加 fallback：
       Noto Color Emoji 接住 emoji 码点，Noto Sans Mono（等宽）接住颜文字符号。
       charset 匹配始终优先于 family，故不会劫持主字体已覆盖的字符。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>ComicShannsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono</string>
    </edit>
  </match>
</fontconfig>
