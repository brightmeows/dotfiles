# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# lazygit 配置 —— 仅保留实际想覆盖默认值的项
# 参考文档: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  # Nerd Font v3，启用文件树图标（前提：终端字体为 Nerd Font v3）
  nerdFontsVersion: "3"
  # 中文界面
  language: zh-CN
  # 聚焦的侧栏自动放大（手风琴效果）
  expandFocusedSidePanel: true

git:
  # 用 delta 渲染 diff（系统已装 /usr/bin/delta）
  pagers:
    - name: delta
      colorArg: always
      pager: delta --dark --paging=never --hunk-header-decoration-style=none
  # gpgsign=true 时默认每次提交都挂起、显示 Press enter to return。
  # 此处 pinentry 经包装脚本解析为 pinentry-qt（GUI 弹窗），且 gpg-agent
  # 已缓存密码（最长 24h），故可安全跳过挂起，提交流程不再被打断。
  overrideGpg: true

update:
  # 系统由 rpm-ostree 管理 lazygit，关闭其内置自更新检查
  method: never

os:
  # 按 e 编辑文件 / reword 时直接调用 nvim
  editPreset: nvim
