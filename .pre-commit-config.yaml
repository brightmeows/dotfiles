repos:
  - repo: local
    hooks:
      - id: format-check
        name: format-check
        description: 检查 TS/JS/JSON/YAML/TOML 文件格式（不写回）
        entry: pnpm format:check
        language: system
        pass_filenames: false
        files: \.(ts|js|json|jsonc|yaml|yml|toml)$

      - id: lint
        name: lint
        description: 检查 JS/TS 代码问题（不写回）
        entry: pnpm lint
        language: system
        pass_filenames: false
        files: \.(ts|js)$

      - id: markdownlint
        name: markdownlint
        description: 检查所有 markdown 文件格式
        entry: markdownlint --config .markdownlint.toml
        language: system
        types: [markdown]
        files: \.md$
