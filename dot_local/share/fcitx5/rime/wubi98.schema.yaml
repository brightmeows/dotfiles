# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi98
  name: "五笔98"
  version: "0.2"
  author:
    - 發明人 王永民先生
  description: |
    五筆字型98版
    碼表源自 ibus-table
    敲 z 鍵進入拼音反查
  dependencies:
    - pinyin_simp
    - melt_eng

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    states: [ 通用, 增廣 ]
  - name: emoji_suggestion
    reset: 1
    states: [ "😣️", "😁️" ]
  - name: simplification
    reset: 1
    states: [ "漢字", "汉字" ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - table_translator@melt_eng
    - reverse_lookup_translator
  filters:
    - simplifier@emoji_suggestion
    - simplifier@simplification
    - uniquifier

speller:
  delimiter: " ;'"
  max_code_length: 4

translator:
  dictionary: wubi98
  enable_charset_filter: true
  enable_sentence: false
  enable_encoder: false
  encode_commit_history: false
  enable_user_dict: false
  disable_user_dict_for_patterns:
    - "^z.*$"

# 英文子翻译器
melt_eng:
  dictionary: melt_eng
  enable_sentence: false
  enable_completion: false
  initial_quality: 0.8

# OpenCC Emoji
emoji_suggestion:
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all
  inherit_comment: false

# 简繁切换（默认简体输出，使用 t2s.json 将繁体转换为简体）
simplification:
  option_name: simplification
  opencc_config: t2s.json
  tips: none
  excluded_types:
    - reverse_lookup

reverse_lookup:
  dictionary: pinyin_simp
  prefix: "z"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "^z[a-z]*'?$"
