patch:
  # 方案元信息
  schema/name: 小鹤双拼
  schema/dependencies:
    - melt_eng

  # 开关列表
  switches:
    - name: ascii_mode
      reset: 1 # 默认英文模式
      states: [中文, 西文]
    - name: full_shape
      states: [半角, 全角]
    - name: simplification
      reset: 1 # 默认简体输出
      states: [漢字, 汉字]
    - name: ascii_punct
      states: [。，, ．，]
    - name: emoji_suggestion
      reset: 1
      states: [ "😣️", "😁️" ]

  # 编码器/拼写
  speller/max_code_length: 4
  speller/auto_select: true
  speller/auto_select_unique_candidate: true

  # 词典：使用万象词库
  translator/dictionary: meow_flypy
  translator/enable_user_dict: true
  translator/enable_sentence: true
  translator/enable_encoder: true
  translator/encode_commit_history: true

  # 英文子翻译器
  melt_eng:
    dictionary: melt_eng
    enable_sentence: false
    enable_completion: false
    initial_quality: 0.8

  # OpenCC Emoji
  emoji_suggestion:
    opencc_config: emoji.json
    option_name: emoji_suggestion
    tips: all
    inherit_comment: false

  # 简繁切换（默认简体输出，使用 t2s.json 将繁体转换为简体）
  simplification:
    option_name: simplification
    opencc_config: t2s.json
    tips: none
    excluded_types:
      - reverse_lookup

  # 处理器链
  engine/processors:
    - lua_processor@*switch_ascii
    - lua_processor@*switch_schema
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  # 翻译器链
  engine/translators:
    - punct_translator
    - table_translator
    - table_translator@melt_eng
    - reverse_lookup_translator

  # 过滤器链
  engine/filters:
    - simplifier@emoji_suggestion
    - simplifier@simplification
    - uniquifier

  # 识别规则
  recognizer/patterns/reverse_lookup: "^[a-z]*'$"
