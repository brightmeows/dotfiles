patch:
  schema/name: 小鹤双拼
  switches:
    - name: ascii_mode
      reset: 1  # 默认英文模式
      states: [ 中文, 西文 ]
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: simplification
      reset: 1  # 默认简体输出
      states: [ 漢字, 汉字 ]
    - name: ascii_punct
      states: [ 。，, ．， ]
  speller/max_code_length: 4  # 最长4码
  speller/auto_select: true  # 顶字上屏
  speller/auto_select_unique_candidate: true  # 无重码自动上屏
  # 中英切换由 lua processor 接管（切换时自动上屏现有输入），
  # lua_processor 置于 processors 链首位以确保最先拦截 Ctrl+Space
  engine/processors:
    - lua_processor@*switch_ascii
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
