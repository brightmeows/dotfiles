patch:
  schema/name: 小鹤双拼
  switches:
    - name: ascii_mode
      reset: 0 # 默认中文模式；中英切换由 fcitx5 Ctrl+Space 接管
      states: [中文, 西文]
    - name: full_shape
      states: [半角, 全角]
    - name: simplification
      reset: 1 # 默认简体输出
      states: [漢字, 汉字]
    - name: ascii_punct
      states: [。，, ．，]
  # 禁用 Rime 内部中英切换（由 fcitx5 控制）
  ascii_composer:
    switch_key:
      Shift_L: noop
      Shift_R: noop
      Control_L: noop
      Control_R: noop
  speller/max_code_length: 4 # 最长4码
  speller/auto_select: true # 顶字上屏
  speller/auto_select_unique_candidate: true # 无重码自动上屏
  # processors 使用方案默认链（ascii_composer/recognizer/key_binder/...）
  translator/dictionary: custom      # 词库：聚合 luna_pinyin + rime_ice + zhwiki + moegirl + 补字（见 custom.dict.yaml）
  translator/enable_user_dict: false # 关闭自学习：不记录用户词典、不自动调频，词序固定为词库原始权重
