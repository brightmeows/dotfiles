# Rime dictionary
# encoding: utf-8
#
# 自定义词库（聚合）：schema 中以 translator/dictionary: custom 引用
# 词条来源全部为包管理产物，本机无需手工下载词库：
#   - cn_dicts/{8105,base,ext,tencent}  <- rime-ice-data（雾凇拼音词库，AUR）
#   - zhwiki                            <- rime-pinyin-zhwiki（官方 extra）
#   - moegirl                           <- rime-pinyin-moegirl（AUR）
# `...` 分隔符之后手工补充缺失字词
---
name: custom
version: "2026-08-29"
sort: by_weight
import_tables:
  - cn_dicts/8105     # 通用规范汉字表
  - cn_dicts/base     # 基础词库
  - cn_dicts/ext      # 扩展词库
  - cn_dicts/tencent  # 腾讯词向量（大词库，编译慢）
  - zhwiki
  - moegirl
...
垌	dong
