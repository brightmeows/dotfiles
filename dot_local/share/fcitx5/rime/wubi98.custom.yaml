patch:
  # 中英切换与方案切换由 lua processor 接管（与双拼配置一致）
  # lua_processor 置于 processors 链首位以确保最先拦截快捷键
  engine/processors:
    - lua_processor@*switch_ascii
    - lua_processor@*switch_schema
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
