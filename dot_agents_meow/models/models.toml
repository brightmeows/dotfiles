# 由 dot_agents_meow/models/import-pi-models.py 从 Pi models.json 生成；
# 这是模型配置的唯一编辑入口，规则与字段见同目录 AGENTS.md。
# models.dev 同名 provider 的条目表示覆盖外部数据；未收录者表示完整定义。

disabled_providers = ["openrouter", "opencode"]

[providers.command-code]
name = "Command Code"
api = "openai-completions"
base_url = "https://api.commandcode.ai/provider/v1"
api_key = "COMMAND_CODE_API_KEY"
compat = { supports_developer_role = false }

